# 安装包时会自动合并：为 DSH 权限下拉框增加纯 LLM 审核预设。
- id: permission
  config:
    # 本插件环境下的新会话默认预设（用户可在设置里显式覆盖）。
    defaultPreset: llm-approve-for-me
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      llm-approve-for-me:
        sandbox: workspace-write
        approval: ask
        name: 帮我批准
        description: 让 AI 审查员决定每次权限升级；无法裁决时询问你。
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- insert:
    - id: llm-approve-for-me
      name: dsh-llm-approve-for-me
